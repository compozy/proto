name: Feature request
description: Propose a change or an addition to @compozy/proto.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior, API, CLI flag or config key you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gallery shell
        - Authoring API / flows
        - CLI
        - MCP / agents
        - Vite plugins / guards
        - Review loop
        - Remote review server
        - Other
    validations:
      required: true
