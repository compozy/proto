[changelog]
header = "# Changelog\n\n"
body = """
## {{ version | default(value="Unreleased") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {{ commit.message }}{% if commit.breaking %} (**breaking**){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^build: (prepare )?release v", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = ".*", group = "Maintenance" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
[bump]
# Same policy as the Compozy repos: while the major version is 0, the minor marks breaking changes
# (the npm/Cargo caret convention): features and fixes bump the patch, breaking changes the minor.
features_always_bump_minor = false
breaking_always_bump_major = false
custom_major_increment_regex = "MAJOR|BREAKING[- ]CHANGE"
initial_tag = "v0.1.0"
