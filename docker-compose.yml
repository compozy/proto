services:
  postgres:
    image: postgres:17-alpine
    container_name: proto-postgres
    environment:
      POSTGRES_USER: proto
      POSTGRES_PASSWORD: proto
      POSTGRES_DB: proto
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - proto-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proto -d proto"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  proto-pg:
